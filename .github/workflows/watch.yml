name: watch
# 町の「予算」のページを巡回し、新しい年度の予算のページ(当初予算の概要・附表)と、使っている原典の差し替え・取り下げを Issue にする。
# 毎月1日の朝と、当初予算が出る2〜4月は毎週月曜の朝(JST)。見つけるだけで、データは変えない(転記と検収は人と Claude Code の作業)。
# 巡回そのものに失敗したときは、ワークフローを失敗させて「巡回に失敗した」Issue を作る。同じ内容の Issue が開いていれば作らない。
# 必要な設定: Settings → Actions → General → Workflow permissions を「Read and write permissions」にする。
on:
  schedule:
    - cron: "0 22 1 * *"     # 毎月1日 7:00 JST(前日 22:00 UTC)
    - cron: "0 22 * 2-4 1"   # 2〜4月の毎週月曜 7:00 JST
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 巡回(1秒に1件以内。約30秒)
        id: watch
        run: |
          set +e
          python3 tools/watch.py --json "$RUNNER_TEMP/watch.json" > "$RUNNER_TEMP/watch.md" 2> "$RUNNER_TEMP/watch.err"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/watch.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/watch.md"; cat "$RUNNER_TEMP/watch.err"

      - name: 結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/watch.json
            ${{ runner.temp }}/watch.md
          if-no-files-found: ignore

      - name: 見つけたものを種類ごとに Issue にする
        if: steps.watch.outputs.code == '0'
        run: |
          python3 - "$RUNNER_TEMP/watch.json" "$RUNNER_TEMP" <<'PY'
          import hashlib, json, os, sys
          rep = json.load(open(sys.argv[1], encoding="utf-8"))
          out = sys.argv[2]
          f = rep["findings"]
          kinds = [
              ("new_year", "新しい年度の予算のページ",
               "町の「予算」のページに、まだこのページに無い年度の予算のページが出た。当初予算の概要と附表があれば、転記と検収の対象になる。",
               ["1. ページを見て、「令和○年度当初予算の概要」と「附表(令和○年度に取り組む主な事業)」の PDF があるかを確かめる(予算編成方針だけなら、まだ。この Issue は開けたままにする)",
                "2. 附表は shiga-hino-plans で起票と検収をする(shiga-hino-plans の CLAUDE.md の定型フロー。PLAN_SCHEMA §9。prompts の 12A と同じ手順)",
                "3. 概要の「予算の規模」の表を `data/totals-r<n>.json` に転記し、hino-town-docs の台帳に2つの PDF を足す",
                "4. hino-ronten の年度の対応表(links/fuhyo-years.tsv)に新しい年度を足す(hino-ronten の 12B の手順)",
                "5. `inputs.lock.json` を上げ、`tools/build_data.py` の EXPECTED_ITEMS と YEARS に年度を足して作り直す(README「作り直し方」)",
                "6. `data/watch.tsv` に新しい年度の2行(fuhyo・gaiyou)を足す(hino-town-docs の台帳の bytes・sha256・fetched を写す)"]),
              ("replaced", "原典の差し替え",
               "台帳 data/watch.tsv の URL の PDF が、台帳の sha256 と違う版になっている。転記した値が変わっている可能性がある。",
               ["1. 新しい版を取得し、hino-town-docs の台帳の bytes・sha256・fetched を直す",
                "2. 附表なら shiga-hino-plans で検収をやり直す(差し替えは shiga-hino-plans の巡回でも Issue になる)。概要なら `data/totals-r<n>.json` の値を新しい版で確かめる",
                "3. `inputs.lock.json` を上げて `tools/build_data.py` で作り直し、`data/watch.tsv` の行を直す"]),
              ("missing", "原典が取れない",
               "台帳 data/watch.tsv の URL が 404 などで取れないか、年度のページからリンクが無くなった。",
               ["1. 年度のページを見て、同じ文書が別の URL にあれば、hino-town-docs の台帳と `data/watch.tsv` の url を直す(sha256 が同じなら原典はそのまま)",
                "2. 町のサイトから外れたなら、Webアーカイブの保存版を探し、台帳の note に書く",
                "3. 画面の出典のリンク(`data/totals-r<n>.json` の source.url と data.js)が切れていないかを確かめる"]),
          ]
          for key, title, what, steps in kinds:
              items = f.get(key) or []
              if not items:
                  continue
              sig = hashlib.sha256("\n".join(sorted(x["url"] for x in items)).encode()).hexdigest()[:8]
              lines = [f"町の予算のページの巡回({rep['date']})で見つけた。{what}", ""]
              for x in items:
                  if key == "new_year":
                      lines.append(f"- {x['label']}: {x['url']}" + (f"({x['note']})" if x.get("note") else ""))
                      for p in x.get("pdfs", []):
                          lines.append(f"  - {p['label'] or '(リンクの文字なし)'}: {p['url']}")
                  elif key == "replaced":
                      lines.append(f"- {x['docs_id']}: 台帳 {x['bytes']} バイト・sha256 {x['sha256'][:12]}… → いま {x['now_bytes']} バイト・{x['now_sha256'][:12]}…"
                                   f"(Last-Modified {x['last_modified'] or '不明'})。{x['url']}")
                  else:
                      lines.append(f"- {x['docs_id']}: {x['reason']}。{x['url']}")
              lines += ["", "## 次にやること"] + steps + ["", f"この Issue は .github/workflows/watch.yml が自動で作った。内容の印: {sig}"]
              with open(os.path.join(out, f"issue-{key}.md"), "w", encoding="utf-8") as w:
                  w.write("\n".join(lines) + "\n")
              with open(os.path.join(out, f"issue-{key}.title"), "w", encoding="utf-8") as w:
                  w.write(f"{title} {len(items)}件({sig})")
          PY
          for key in new_year replaced missing; do
            T="$RUNNER_TEMP/issue-$key.title"; [ -f "$T" ] || continue
            TITLE=$(cat "$T"); SIG=$(sed -E 's/.*\((.*)\)$/\1/' "$T")
            if gh issue list --state open --search "\"$SIG\" in:title" --json number -q '.[0].number' | grep -q .; then
              echo "同じ内容の Issue が開いている: $TITLE"; continue
            fi
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue-$key.md"
          done

      - name: 巡回に失敗したら Issue にして失敗で終わる
        if: steps.watch.outputs.code != '0'
        run: |
          TITLE="巡回に失敗した(watch.yml)"
          if gh issue list --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number' | grep -q .; then
            echo "失敗の Issue はすでに開いている"
          else
            {
              echo "町の予算のページの巡回(.github/workflows/watch.yml)が失敗した。終了コード ${{ steps.watch.outputs.code }}。"
              echo
              echo "実行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo
              echo '```'; cat "$RUNNER_TEMP/watch.err" 2>/dev/null | tail -20; echo '```'
              echo
              echo "町のサイトの作りが変わったか、一時的に取れない。手元で \`python3 tools/watch.py\` を実行して原因を見る。一時的なものなら、この Issue を閉じるだけでよい。"
            } > "$RUNNER_TEMP/fail.md"
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/fail.md"
          fi
          exit 1
